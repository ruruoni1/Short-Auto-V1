<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="니혼줍줍 AutoPlanner 장면 계획 검토 화면" />
    <title>자동 장면 계획 · 니혼줍줍</title>
    <link rel="stylesheet" href="/planner.css" />
    <script type="module" src="/planner.js"></script>
  </head>
  <body>
    <main class="planner-shell">
      <header class="planner-header">
        <div>
          <p class="eyebrow">AUTOPLANNER REVIEW</p>
          <h1>자동 장면 계획을 검토하세요</h1>
          <p>SourceTimeline을 기준으로 장면 후보를 만들고, 낮은 신뢰도와 잠금 장면을 확인합니다.</p>
        </div>
        <nav aria-label="작업 공간"><a href="/">클립 라이브러리</a><a href="/studio">썸네일 스튜디오</a></nav>
      </header>

      <section class="planner-grid" aria-label="AutoPlanner 입력과 결과">
        <form id="planner-form" class="planner-card">
          <div class="card-heading"><div><h2>입력</h2><p>SourceTimeline JSON을 붙여 넣으세요.</p></div><button id="load-sample" class="button button-secondary" type="button">예시 불러오기</button></div>
          <label class="field"><span>SourceTimeline</span><textarea id="source-json" rows="18" spellcheck="false" required></textarea><small>durationMs와 captions 배열이 필요합니다.</small></label>
          <label class="field"><span>기존 잠금 Scene (선택)</span><textarea id="existing-json" rows="8" spellcheck="false" placeholder="[]"></textarea><small>잠금 장면은 계획 결과에서 보존됩니다.</small></label>
          <button class="button button-primary" type="submit">장면 계획 생성</button>
          <p id="planner-alert" class="alert" role="alert" aria-live="assertive" hidden></p>
        </form>

        <section class="planner-card" aria-labelledby="result-title">
          <div class="card-heading"><div><h2 id="result-title">검토 결과</h2><p id="result-summary">아직 계획을 생성하지 않았습니다.</p></div></div>
          <div id="diagnostics" class="diagnostics" aria-live="polite"></div>
          <div class="table-wrap"><table><thead><tr><th>ID</th><th>유형</th><th>시간</th><th>내용</th><th>신뢰도</th><th>상태</th></tr></thead><tbody id="scene-rows"><tr><td colspan="6" class="empty">계획 생성 후 장면이 표시됩니다.</td></tr></tbody></table></div>
        </section>
      </section>
    </main>
  </body>
</html>
